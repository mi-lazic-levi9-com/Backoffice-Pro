<div class="settings-container">
  <h1>Settings</h1>
  <p>Manage your account settings and preferences.</p>

  <div class="settings-card">
    <h2>Profile</h2>
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" value="Admin" />
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" value="admin@example.com" disabled />
    </div>
    <div class="form-group">
      <label for="bio">Bio</label>
      <textarea id="bio" rows="3">A brief description of yourself.</textarea>
    </div>
    <button class="btn-primary">Update Profile</button>
  </div>
</div>
